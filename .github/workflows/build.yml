name: Сборка и релиз

# Каждый пуш в main собирает APK и выпускает релиз v1.0.N.
# Установленные приложения сами находят его и предлагают обновиться.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IPTV_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты
        run: ./gradlew :app:testDebugUnitTest --tests '*ParsersTest*'

      - name: Сборка
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk iptv.apk

      # Версия для телевизоров Samsung (Tizen): веб-приложение в архиве .wgt, без подписи
      - name: Сборка для Samsung
        run: |
          sed -i "s/version=\"1.0.0\" viewmodes/version=\"1.0.${IPTV_BUILD}\" viewmodes/" samsung/config.xml
          sed -i "s/var VERSION = '1.0.0'/var VERSION = '1.0.${IPTV_BUILD}'/" samsung/app.js
          (cd samsung && zip -qr ../iptv-samsung.wgt .)

      - uses: actions/upload-artifact@v4
        with:
          name: iptv
          path: |
            iptv.apk
            iptv-samsung.wgt

      # Постоянная ссылка на свежую версию:
      # https://github.com/<владелец>/<репозиторий>/releases/latest/download/iptv.apk
      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IPTV 1.0.${{ github.run_number }}
          files: |
            iptv.apk
            iptv-samsung.wgt
          generate_release_notes: true
          make_latest: true
