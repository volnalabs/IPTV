name: Сборка и релиз

# Каждый пуш в main собирает все версии и выпускает релиз v1.0.N.
# Приложение для Android само находит новый релиз и предлагает обновиться.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "plugins/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IPTV_BUILD: ${{ github.run_number }}
  IPTV_VERSION: 1.0.${{ github.run_number }}

jobs:
  # Android (ТВ и телефоны), Samsung (Tizen), LG (webOS)
  tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты
        run: ./gradlew :app:testDebugUnitTest --tests '*ParsersTest*'

      - name: Android
        run: |
          ./gradlew :app:assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/iptv.apk

      # Веб-приложение в архиве .wgt, без подписи
      - name: Samsung
        run: |
          sh scripts/build-web.sh samsung build/samsung "$IPTV_VERSION"
          (cd build/samsung && zip -qr ../../out/iptv-samsung.wgt .)

      - name: LG
        run: |
          sh scripts/build-web.sh lg build/lg "$IPTV_VERSION"
          npx -y -p @webos-tools/cli@3.2.6 ares-package build/lg -o build/lg-out --no-minify
          cp build/lg-out/*.ipk out/iptv-lg.ipk

      - uses: actions/upload-artifact@v4
        with:
          name: tv
          path: out/*

  # Linux, Windows, macOS
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, flags: "--linux" }
          - { name: windows, os: windows-latest, flags: "--win" }
          - { name: mac, os: macos-latest, flags: "--mac --x64 --arm64" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Сборка
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          sh scripts/build-web.sh desktop desktop/app "$IPTV_VERSION"
          cd desktop
          npm install --no-audit --no-fund
          npx electron-builder ${{ matrix.flags }} --publish never -c.extraMetadata.version="$IPTV_VERSION"

      - name: Имена файлов
        run: |
          mkdir -p out
          for f in desktop/dist/*.AppImage; do [ -e "$f" ] && cp "$f" out/iptv-linux.AppImage; done
          for f in desktop/dist/*.exe; do [ -e "$f" ] && cp "$f" out/iptv-windows.exe; done
          for f in desktop/dist/*.dmg; do
            [ -e "$f" ] || continue
            case "$f" in
              *arm64*) cp "$f" out/iptv-mac-apple-silicon.dmg ;;
              *) cp "$f" out/iptv-mac-intel.dmg ;;
            esac
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: out/*

  # Релиз выходит, даже если какая-то из версий для компьютера не собралась
  release:
    needs: [tv, desktop]
    if: ${{ always() && needs.tv.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Нужен только текст «какой файл скачать»
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # Постоянные ссылки на свежую версию:
      # https://github.com/<владелец>/<репозиторий>/releases/latest/download/<файл>
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IPTV 1.0.${{ github.run_number }}
          files: out/*
          body_path: .github/release-notes.md
          generate_release_notes: true
          make_latest: true
