name: Сборка APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Тесты
        run: ./gradlew :app:testDebugUnitTest --tests '*ParsersTest*'

      - name: Сборка
        env:
          VOLNA_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk volna-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: volna-tv
          path: volna-tv.apk

      # При пуше тега v1.2.3 создаётся релиз. Постоянная ссылка на свежую версию:
      # https://github.com/<владелец>/<репозиторий>/releases/latest/download/volna-tv.apk
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: volna-tv.apk
          generate_release_notes: true
