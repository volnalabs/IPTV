  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#353A42"/><stop offset="1" stop-color="#202329"/></linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F0A37D" stop-opacity="0"/><stop offset=".55" stop-color="#F0A37D" stop-opacity=".9"/><stop offset="1" stop-color="#FF765E" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
</defs>
