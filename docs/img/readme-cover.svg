<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">IPTV — тихий плеер для ваших экранов</title>
<desc id="desc">Минималистичная тёмная обложка с коралловой волной и интерфейсом телепрограммы.</desc>
