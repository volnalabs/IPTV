<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>IPTV</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<video id="video"></video>

<div id="loading"></div>
<div id="msg"></div>

<div id="info">
  <div id="infoLogo"></div>
  <div id="infoText">
    <div id="infoTop"><span id="infoNum"></span><span id="infoGroup"></span></div>
    <div id="infoName"></div>
  </div>
  <div id="infoClock"></div>
</div>

<div id="num"></div>

<div id="panel">
  <div id="groups" class="card card2">
    <div class="cap">Группы</div>
    <div id="glist"></div>
  </div>
  <div id="chans" class="card">
    <div id="ctitle"></div>
    <div id="search">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4.5 11a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M16 16l4.5 4.5"/></svg>
      <input id="q" type="text" placeholder="Название канала" autocomplete="off" spellcheck="false">
    </div>
    <div id="chint"></div>
    <div id="clist"></div>
  </div>
</div>

<div id="setup">
  <div class="setupCard">
    <div class="cap">Плейлист</div>
    <div class="setupTitle">Ссылка на плейлист</div>
    <input id="url" type="text" placeholder="http://…/playlist.m3u8" autocomplete="off" spellcheck="false">
    <div id="setupButtons">
      <div class="btn primary" id="save">Сохранить</div>
      <div class="btn" id="cancel">К каналам</div>
    </div>
    <div id="setupStatus"></div>
    <div id="version"></div>
  </div>
</div>

<div id="splash">
  <div class="mark"><svg viewBox="0 0 24 24"><path d="M9 7l8.5 5L9 17z"/></svg></div>
  <div class="word">IPTV</div>
  <div class="dots"><i></i><i></i><i></i></div>
  <div id="splashCap"></div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
