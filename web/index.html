<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>IPTV</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Плеер: видео и слои над ним. На телевизоре — весь экран, в окне компьютера — прямоугольник плеера -->
<div id="stage">
<video id="video"></video>
<div id="shadeB"></div>
<div id="shadeT"></div>
<div id="osd"></div>
<div id="state" role="alert"></div>
<div id="osdTop"><div id="archTag"></div><div id="topRight"></div></div>
<div id="zap"></div>
<div id="vol"></div>
<div id="timeline"></div>
<div id="ctl"><div id="ctlCap"></div><div id="ctlRow"></div></div>

<!-- Ввод номера: набранные цифры и подходящие каналы -->
<div id="numpad"></div>
<div id="numHints" class="hints"></div>
</div>

<!-- Гид: меню разделов | каналы | подробности и программа. На компьютере — шапка окна и три колонки с плеером -->
<div id="guide">
  <div id="ghead">
    <div id="gbrand"><span class="bm"><svg viewBox="0 0 24 24"><path d="M9 7l8.5 5L9 17z"/></svg></span>IPTV</div>
    <div id="gtitle" data-z="head" data-i="0"></div>
    <div id="gsearch"><svg class="ic" viewBox="0 0 24 24"><path d="M4.5 11a6.5 6.5 0 1 0 13 0a6.5 6.5 0 1 0-13 0M16 16l4.5 4.5"/></svg><input id="q" type="text" placeholder="Название, номер или передача" autocomplete="off" spellcheck="false" aria-label="Поиск"><span class="hintq">начните печатать</span></div>
    <span id="gside" class="btn sm" data-a="side"><svg class="ic" viewBox="0 0 24 24"><path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/></svg>Каналы</span>
    <div id="gclock"></div>
    <span id="ggrid" data-z="head" data-i="1" role="button" aria-label="Телепрограмма — сетка каналов" title="Телепрограмма — сетка каналов"></span>
    <span id="gset" data-z="head" data-i="2" role="button" aria-label="Настройки" title="Настройки"><svg class="ic" viewBox="0 0 24 24"><path d="M9.87 5.02 L10.50 2.52 L13.50 2.52 L14.13 5.02 L15.43 5.55 L17.64 4.23 L19.77 6.36 L18.45 8.57 L18.98 9.87 L21.48 10.50 L21.48 13.50 L18.98 14.13 L18.45 15.43 L19.77 17.64 L17.64 19.77 L15.43 18.45 L14.13 18.98 L13.50 21.48 L10.50 21.48 L9.87 18.98 L8.57 18.45 L6.36 19.77 L4.23 17.64 L5.55 15.43 L5.02 14.13 L2.52 13.50 L2.52 10.50 L5.02 9.87 L5.55 8.57 L4.23 6.36 L6.36 4.23 L8.57 5.55z M9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0"/></svg></span>
  </div>
  <div id="gbody">
    <div id="gmenu" role="listbox" aria-label="Разделы"></div>
    <div id="gmid"><div id="gcap"></div><div id="gchs" role="listbox" aria-label="Каналы"></div></div>
    <div id="gright"><div id="dplayer"></div><div id="gdet"></div></div>
  </div>
  <div id="ghints" class="hints"></div>
</div>

<!-- Сетка «каналы × время» -->
<div id="grid"></div>

<!-- Поиск: экранная клавиатура и результаты по разделам -->
<div id="searchScr" class="screen"></div>

<!-- Настройки, плейлисты, плагины -->
<div id="setup" class="screen"></div>

<!-- Первый запуск -->
<div id="onb" class="screen"></div>

<!-- Меню плейлистов и действий, диалоги, уведомления -->
<div id="dctl"></div>
<div id="dtip" role="tooltip"></div>
<div id="pop" role="menu"></div>
<div id="dialog"></div>

<div id="splash">
  <div class="mark"><svg viewBox="0 0 24 24"><path d="M9 7l8.5 5L9 17z"/></svg></div>
  <div class="word">IPTV</div>
  <div class="dots"><i></i><i></i><i></i></div>
  <div id="splashCap"></div>
</div>

<div id="toast" role="status"></div>
<script src="plugin-runtime.js"></script>
<script src="app.js"></script>
</body>
</html>
